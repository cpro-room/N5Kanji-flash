<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>漢字テスト</title>

<style>
body {
  font-family: "Yu Gothic", "Meiryo", sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px;
}

.question {
  font-size: clamp(100px, 30vw, 200px);
  margin: 40px 0 10px;
  line-height: 1.1;
}

.reading {
  font-size: clamp(40px, 10vw, 70px);
  color: #333;
  height: 90px;
  margin-bottom: 30px;
}

.khmer {
  font-size: clamp(28px, 7vw, 50px);
  color: #555;
  min-height: 60px;
  margin-bottom: 30px;
}

button {
  font-size: clamp(50px, 12vw, 80px);
  padding: 18px 40px;
  border: none;
  border-radius: 16px;
  cursor: pointer;
}

.counter {
  position: fixed;
  right: 10px;
  bottom: 10px;
  font-size: 16px;
  color: #666;
}

@media (max-width: 600px) {
  body {
    padding: 10px;
  }

  .reading {
    height: 100px;
    margin-bottom: 20px;
  }

  button {
    width: 90%;
    max-width: 320px;
  }
}
</style>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-DDD1Y5SELD"></script>

{w:"帰ります",g:"verb",r:"かえります",k:"ត្រឡប់ទៅ/ត្រឡប់មក"},
{w:"書きます",g:"verb",r:"かきます",k:"សរសេរ"},
{w:"読みます",g:"verb",r:"よみます",k:"អាន"},
{w:"話します",g:"verb",r:"はなします",k:"និយាយ(គ្នា)"},
{w:"聞きます",g:"verb",r:"ききます",k:"ស្តាប់/សួរ"},
{w:"食べます",g:"verb",r:"たべます",k:"ញុំា/ហូប(ទំពារ)"},
{w:"飲みます",g:"verb",r:"のみます",k:"ញុំា/ហូប/ផឹក/លេប"},
{w:"買います",g:"verb",r:"かいます",k:"ទិញ"},

let words = smartShuffle([...originalWords]);
let currentIndex = 0;
let revealed = false;

// 初期表示
render();

function smartShuffle(arr) {
  let result = [];
  let pool = [...arr];
  let last = null;

  while (pool.length > 0) {
    let candidates = pool.filter(x => x.g !== last);
    if (candidates.length === 0) candidates = pool;

    const pick = candidates[Math.floor(Math.random() * candidates.length)];

    result.push(pick);
    pool = pool.filter(x => x !== pick);
    last = pick.g;
  }

  return result;
}

// 表示更新
function render() {
  const word = words[currentIndex];

  document.getElementById("question").textContent = word.w;
  document.getElementById("counter").textContent = currentIndex + 1;

  document.getElementById("reading").textContent =
    revealed ? word.r : "";

  document.getElementById("khmer").textContent =
    revealed ? word.k : "";
}

// ボタン動作（2段階）
function handle() {
  if (!revealed) {
    // 1回目：読み表示
    revealed = true;
    render();
  } else {
    // 2回目：次へ
    currentIndex++;

    if (currentIndex >= words.length) {
      words = smartShuffle([...originalWords]);
      currentIndex = 0;
    }

    revealed = false;
    render();
  }
}
