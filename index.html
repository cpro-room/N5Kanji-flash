<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>漢字テスト</title>

<style>
body {
  font-family: "Yu Gothic", "Meiryo", sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px;
}

/* 漢字（かなり大きく） */
.question {
  font-size: clamp(100px, 30vw, 200px);
  margin: 40px 0 10px;
  line-height: 1.1;
}

/* 読み（はっきり見えるサイズ） */
.reading {
  font-size: clamp(40px, 10vw, 70px);
  color: #333;
  height: 90px;
  margin-bottom: 30px;
}

/* ボタン（授業用・タップしやすく大きく） */
button {
  font-size: clamp(50px, 12vw, 80px);
  padding: 18px 40px;
  border: none;
  border-radius: 16px;
  cursor: pointer;
}

/* カウンター */
.counter {
  position: fixed;
  right: 10px;
  bottom: 10px;
  font-size: 16px;
  color: #666;
}

/* スマホ微調整 */
@media (max-width: 600px) {
  body {
    padding: 10px;
  }

  .reading {
    height: 100px;
    margin-bottom: 20px;
  }

  button {
    width: 90%;
    max-width: 320px;
  }
}</style>
</head>

<body>

<div class="question" id="question"></div>
<div class="reading" id="reading"></div>

<button onclick="handle()">▶</button>
<div class="counter" id="counter">1</div>

<script>

const originalWords = [

{w:"町",g:"place",r:"まち"},

{w:"東",g:"dir",r:"ひがし"},
{w:"西",g:"dir",r:"にし"},

{w:"見ます",g:"verb",r:"みます"},
{w:"立ちます",g:"verb",r:"たちます"},
{w:"入ります",g:"verb",r:"はいります"},
{w:"出ます",g:"verb",r:"でます"},
{w:"休みます",g:"verb",r:"やすみます"},
{w:"行きます",g:"verb",r:"いきます"},
{w:"来ます",g:"verb",r:"きます"},
{w:"言います",g:"verb",r:"いいます"},
{w:"帰ります",g:"verb",r:"かえります"},
{w:"書きます",g:"verb",r:"かきます"},
{w:"読みます",g:"verb",r:"よみます"},
{w:"話します",g:"verb",r:"はなします"},
{w:"聞きます",g:"verb",r:"ききます"},
{w:"食べます",g:"verb",r:"たべます"},
{w:"飲みます",g:"verb",r:"のみます"},
{w:"買います",g:"verb",r:"かいます"}
];

let words = smartShuffle([...originalWords]);
let currentIndex = 0;
let revealed = false;

// 初期表示
render();

function smartShuffle(arr) {
  let result = [];
  let pool = [...arr];
  let last = null;

  while (pool.length > 0) {
    let candidates = pool.filter(x => x.g !== last);
    if (candidates.length === 0) candidates = pool;

    const pick = candidates[Math.floor(Math.random() * candidates.length)];

    result.push(pick);
    pool = pool.filter(x => x !== pick);
    last = pick.g;
  }

  return result;
}

// 表示更新
function render() {
  const word = words[currentIndex];

  document.getElementById("question").textContent = word.w;
  document.getElementById("counter").textContent = currentIndex + 1;

  // 読みは最初は空
  document.getElementById("reading").textContent = revealed ? word.r : "";
}

// ボタン動作（2段階）
function handle() {
  if (!revealed) {
    // 1回目：読み表示
    revealed = true;
    render();
  } else {
    // 2回目：次へ
    currentIndex++;

    if (currentIndex >= words.length) {
      words = smartShuffle([...originalWords]);
      currentIndex = 0;
    }

    revealed = false;
    render();
  }
}

</script>

</body>
</html>
